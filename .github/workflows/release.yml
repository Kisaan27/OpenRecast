name: Release

# Push a tag like v0.1.0 to build the DMG and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app and DMG
        run: VERSION="${GITHUB_REF_NAME#v}" ./build_app.sh
      # A copy without the version in its name, so .../releases/latest/download/OpenRecast.dmg always works.
      - name: Add stable download name
        run: cp dist/OpenRecast-*.dmg dist/OpenRecast.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
